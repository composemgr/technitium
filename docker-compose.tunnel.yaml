name: technitium
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: casjaysdevdocker/technitium:latest
    container_name: technitium-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      DNS_SERVER_RECURSION: Allow
      DNS_SERVER_ENABLE_BLOCKING: 'true'
      DNS_SERVER_FORWARDER_PROTOCOL: Tcp
      DNS_SERVER_LOG_USING_LOCAL_TIME: 'true'
      DNS_SERVER_WEB_SERVICE_HTTP_PORT: '5380'
      DNS_SERVER_WEB_SERVICE_HTTPS_PORT: '5381'
      DNS_SERVER_ALLOW_TXT_BLOCKING_REPORT: 'true'
      DNS_SERVER_ADMIN_PASSWORD: ${APP_ADMIN_PASS:-replace-with-a-random-password}
      DNS_SERVER_WEB_SERVICE_ENABLE_HTTPS: 'true'
      DNS_SERVER_DOMAIN: ${BASE_DOMAIN_NAME:-example.com}
      DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_HTTP: 'true'
      DNS_SERVER_WEB_SERVICE_USE_SELF_SIGNED_CERT: 'false'
      DNS_SERVER_FORWARDERS: ${DNS_SERVER_FORWARDERS:-82.29.128.43, 1.1.1.1, 8.8.8.8}
      CONTAINER_NAME: technitium-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/5380']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '53:53/tcp'
      - '53:53/udp'
      - '67:67/udp'
      - '443:443/tcp'
      - '853:853/tcp'
      - '53443:53443/tcp'
    volumes:
      - './volumes/config/technitium:/etc/dns'
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65000
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://technitium-app:5380'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - technitium
      - cloudflare

networks:
  technitium:
    name: technitium
    external: false
  cloudflare:
    external: true
